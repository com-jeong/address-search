<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>주소 검색</title>
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>
  <script>
    // URL 파라미터 추출
    const params = new URLSearchParams(window.location.search);
    const table = params.get("table");
    const linkedRelation = params.get("linkedRelation");

    function execDaumPostcode() {
      new daum.Postcode({
        oncomplete: function(data) {
          // 도로명 주소 + 건물명
          let address = data.roadAddress;
          if (data.buildingName !== '' && data.apartment === 'Y') {
            address += ' (' + data.buildingName + ')';
          }

          // Make Webhook으로 전송 (rowId 제거됨)
          fetch("https://hook.us1.make.com/6vwga42ofzkoln2aaxlggjwvhfz1j6cp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              address: address,
              table: table,
              linkedRelation: linkedRelation
            })
          }).then(() => window.close());
        }
      }).open();
    }

    window.onload = execDaumPostcode;
  </script>
</body>
</html>
